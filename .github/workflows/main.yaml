on: # yamllint disable-line rule:truthy
  push: { branches: [main] }
  pull_request: { branches: [main] }
  workflow_dispatch:

permissions: {}

jobs:
  smoke:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: bin/linux-amd64.toml
      - run: bin/github.toml
      #      bin/python.toml is not run, python3.13 is not installed
  main:
    runs-on: ubuntu-26.04
    needs: smoke
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      # yamllint disable-line rule:line-length
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with: { enable-cache: false }
      - run: >
          sudo apt-get update
          && sudo apt-get install --yes --no-install-recommends python3-sane
      - run: ./noxfile.py
  renovate-config-validator:
    needs: smoke
    # yamllint disable-line rule:line-length
    uses: maxwell-k/dotlocalslashbin/.github/workflows/renovate.yaml@8c2932b5fac20190a3a6114237374176d7c2508c # v0.0.28
  matrix:
    needs: smoke
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        image:
          - "" # use default in ./tests/matrix.sh
          - debian/13/cloud
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      # setup-incus is pinned manually, because the repository is not tagged
      # yamllint disable-line rule:line-length
      - uses: maxwell-k/setup-incus@0952866d9763c14ac856700a5c2527c634331bea # main
      - run: incus admin init --auto
      - run: tests/matrix.sh
        env:
          LOGNAME: maxwell-k
          MATRIX_IMAGE: ${{ matrix.image }}
  zizmor:
    runs-on: ubuntu-26.04
    # https://github.com/zizmorcore/zizmor-action#permissions
    permissions: { security-events: write }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      # yamllint disable-line rule:line-length
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
  actionlint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      # yamllint disable-line rule:line-length
      - uses: kjanat/actionlint@722799fa4b8cc6734debb97bae24aca9e0dbaf59 # v1
  fonts:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: bin/fonts.toml
  uv-check:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      # yamllint disable-line rule:line-length
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with: { enable-cache: false }
      - run: >-
          git ls-files '*.py' ':(exclude)local/bin/landscape.py'
          | xargs -t -n1 uv --preview-features check-command check --script
      # local/bin/landscape.py is excluded above because it has a dependency on
      # python-sane. python-sane does not publish wheels and requires a C
      # compiler and development headers to install from a source distribution.
      # To check locally, try a system package. For example on Fedora Linux
      # install python3-sane with dnf and run:
      # uv tool run ty check --python /usr/bin/python local/bin/landscape.py
